# cargo-audit configuration, picked up by cargo audit (and the CI job).
#
# Cargo.lock records every optional dependency of the crates we use, even when
# the feature that would compile them is disabled. sqlx 0.8 always resolves its
# optional MySQL and SQLite drivers into the lockfile, but this workspace only
# enables the Postgres driver, so neither crate is ever built. Drop these ignores
# if the MySQL or SQLite drivers are ever enabled.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa 0.9 (Marvin attack), reachable only via sqlx-mysql
    "RUSTSEC-2026-0459", # libsqlite3-sys CVE, reachable only via sqlx-sqlite
]
