[workspace]
members = [
    "client",
    "server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/walkonthemarz/sensor"

# Shared dependency versions for every crate in the workspace. Members opt in
# with `<crate>.workspace = true`, so upgrades happen in one place.
[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
base64ct = "1.8"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
http = "1"
p256 = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
sad-web-push = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.6"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "time"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
