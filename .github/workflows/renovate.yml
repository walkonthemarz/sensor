name: Renovate

on:
  schedule:
    # Daily at 03:00 UTC; renovate.json can narrow this further.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "renovate.json"
      - ".github/workflows/renovate.yml"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.14
        with:
          # RENOVATE_TOKEN is a PAT (repo + workflow scopes) stored in the
          # repository secrets. The workflow scope lets Renovate open PRs that
          # touch .github/workflows/*.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # A self-hosted Renovate token can see every repository the account
          # can reach; keep this run scoped to the current repository.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
