name: Renovate

on:
  schedule:
    # Daily at 03:00 UTC; renovate.json can narrow this further.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "renovate.json"
      - ".github/workflows/renovate.yml"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Renovate token
        id: token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::warning::RENOVATE_TOKEN is not set; add a PAT with repo and workflow scopes to enable Renovate."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Run Renovate
        if: steps.token.outputs.enabled == 'true'
        uses: renovatebot/github-action@v46.3.15
        with:
          # RENOVATE_TOKEN is a PAT (repo + workflow scopes) stored in the
          # repository secrets. The workflow scope lets Renovate open PRs that
          # touch .github/workflows/*.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # A self-hosted Renovate token can see every repository the account
          # can reach; keep this run scoped to the current repository.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
