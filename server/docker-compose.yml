name: sensor

services:
  postgres:
    image: postgres:17-alpine
    container_name: sensor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sensor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
      POSTGRES_DB: ${POSTGRES_DB:-sensor_data}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sensor_user} -d ${POSTGRES_DB:-sensor_data}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sensor

  sensor-server:
    build: .
    container_name: sensor-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      SENSOR_API_KEY: ${SENSOR_API_KEY:?Set SENSOR_API_KEY in server/.env}
      DATABASE_URL: postgres://${POSTGRES_USER:-sensor_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sensor_data}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - sensor

  caddy:
    image: caddy:2-alpine
    container_name: sensor-caddy
    restart: unless-stopped
    depends_on:
      sensor-server:
        condition: service_healthy
    environment:
      UPSTREAM: sensor-server:3000
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - sensor

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  sensor:
